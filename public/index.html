<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutriBot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap top"><h1>NutriBot</h1>
    <nav role="tablist">
      <button role="tab" data-tab="chat" aria-selected="true">Chat</button>
      <button role="tab" data-tab="plan" aria-selected="false">Diet plan</button>
    </nav></div>
  <div class="wrap day"><span id="dtxt">Today: 0 / 2000 kcal</span><div class="bar"><i id="dbar"></i></div></div>
</header>

<section id="tab-chat" class="tab">
  <main id="chat" class="wrap" aria-live="polite"></main>
  <div class="dock"><div class="wrap">
    <div class="chips" id="chips"></div>
    <form id="cf" autocomplete="off"><input id="cq" aria-label="Ask NutriBot" placeholder="e.g. 2 eggs and 1 roti, or 150 g paneer"><button type="submit">Ask</button></form>
  </div></div>
</section>

<section id="tab-plan" class="tab" hidden>
  <div class="wrap scroll">
    <form id="pf" class="grid">
      <label>Age<input name="age" type="number" min="14" max="90" required value="21"></label>
      <label>Sex<select name="sex"><option value="female">Female</option><option value="male">Male</option></select></label>
      <label>Height (cm)<input name="height" type="number" min="120" max="220" required value="160"></label>
      <label>Weight (kg)<input name="weight" type="number" min="30" max="250" step="0.1" required value="55"></label>
      <label>Activity<select name="activity"><option value="sedentary">Mostly sitting</option><option value="light" selected>Light (1-3 workouts/wk)</option><option value="moderate">Moderate (3-5/wk)</option><option value="active">Very active</option></select></label>
      <label>Goal<select name="goal"><option value="lose">Lose weight</option><option value="maintain" selected>Maintain weight</option><option value="gain">Gain weight</option></select></label>
      <label>Food preference<select name="diet"><option value="veg">Vegetarian</option><option value="vegan">Vegan</option><option value="nonveg">Non-vegetarian</option></select></label>
      <button type="submit" class="primary">Build my 7-day plan</button>
    </form>
    <p id="perr" class="err" role="alert"></p>
    <div id="plan"></div>
  </div>
</section>
<script src="app.js"></script>
</body>
</html>
